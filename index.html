<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge-Fighters Superpower Wheel</title>
  <style>
    :root { --gold: #ffc857; --ember: #ff7a18; --ink: #17131f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; color: #fff;
      background: radial-gradient(circle at top, #4d1d36, #17131f 65%);
    }
    main { width: min(92vw, 720px); text-align: center; padding: 24px 0; }
    h1 { margin: 0 0 6px; color: var(--gold); letter-spacing: 2px; }
    .subtitle { margin: 0 0 18px; color: #cfc7d8; }
    .wheel-wrap { position: relative; width: min(82vw, 480px); aspect-ratio: 1; margin: auto; }
    .pointer {
      position: absolute; z-index: 3; left: 50%; top: -10px; transform: translateX(-50%);
      width: 0; height: 0; border-left: 19px solid transparent; border-right: 19px solid transparent;
      border-top: 38px solid var(--gold); filter: drop-shadow(0 4px 3px #0008);
    }
    canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 12px 40px #0009, inset 0 0 25px #fff2; }
    #spin {
      margin-top: 22px; border: 0; border-radius: 999px; padding: 15px 38px;
      background: linear-gradient(135deg, var(--gold), var(--ember)); color: #201019;
      font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 20px #0006;
    }
    #spin:disabled { opacity: .6; cursor: wait; }
    #result { min-height: 76px; margin: 18px auto 0; max-width: 560px; }
    #power { display: block; font-size: clamp(22px, 6vw, 34px); color: var(--gold); }
    #description { color: #dfd7e6; }
  </style>
</head>
<body>
  <main>
    <h1>FORGE-FIGHTERS</h1>
    <p class="subtitle">Roll a Superpower</p>
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="600" height="600" aria-label="Superpower wheel"></canvas>
    </div>
    <button id="spin">SPIN THE WHEEL</button>
    <div id="result" aria-live="polite"><span id="power"></span><span id="description"></span></div>
  </main>

  <script>
    const powers = [
      { name: 'Flame Fist', description: 'Explosive fire damage', color: '#e44d26' },
      { name: 'Frost Shield', description: 'Freeze and protect', color: '#2b88d8' },
      { name: 'Thunder Dash', description: 'Strike faster than lightning', color: '#7057d9' },
      { name: 'Stone Skin', description: 'Become nearly unbreakable', color: '#7a704e' },
      { name: 'Shadow Step', description: 'Teleport through darkness', color: '#39304a' },
      { name: 'Venom Strike', description: 'Poison every target', color: '#65a30d' },
      { name: 'Solar Burst', description: 'Blast your enemies with light', color: '#e9a820' },
      { name: 'Time Warp', description: 'Slow time around you', color: '#168b86' }
    ];

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinButton = document.getElementById('spin');
    const powerLabel = document.getElementById('power');
    const descriptionLabel = document.getElementById('description');
    const center = canvas.width / 2;
    const radius = canvas.width / 2 - 12;
    const slice = (Math.PI * 2) / powers.length;
    let angle = 0;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.width);
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(angle);

      powers.forEach((power, i) => {
        const start = i * slice - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, start + slice);
        ctx.closePath();
        ctx.fillStyle = power.color;
        ctx.fill();
        ctx.strokeStyle = '#fff7';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + slice / 2);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 23px system-ui';
        ctx.shadowColor = '#0009';
        ctx.shadowBlur = 4;
        ctx.fillText(power.name, radius * 0.64, 8);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, 44, 0, Math.PI * 2);
      ctx.fillStyle = '#17131f';
      ctx.fill();
      ctx.strokeStyle = '#ffc857';
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.restore();
    }

    function spin() {
      spinButton.disabled = true;
      powerLabel.textContent = '';
      descriptionLabel.textContent = '';

      const winner = Math.floor(Math.random() * powers.length);
      const targetSliceCenter = winner * slice;
      const fullTurns = 5 + Math.floor(Math.random() * 4);
      const target = fullTurns * Math.PI * 2 + (Math.PI * 2 - targetSliceCenter);
      const start = angle;
      const startTime = performance.now();
      const duration = 4200;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        angle = start + (target - start) * eased;
        draw();
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          angle = angle % (Math.PI * 2);
          draw();
          const won = powers[winner];
          powerLabel.textContent = won.name;
          descriptionLabel.textContent = won.description;
          spinButton.disabled = false;
          spinButton.textContent = 'SPIN AGAIN';
        }
      }
      requestAnimationFrame(animate);
    }

    spinButton.addEventListener('click', spin);
    draw();
  </script>
</body>
</html>
